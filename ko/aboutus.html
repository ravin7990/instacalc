  <button id="backToTopBtn" class="back-to-top" type="button" aria-label="맨 위로">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script>
    (function () {
      var menuToggle = document.getElementById("menuToggle");
      var mainNav = document.getElementById("mainNav");
      var backToTopBtn = document.getElementById("backToTopBtn");
      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", function () {
          var isOpen = mainNav.classList.toggle("open");
          menuToggle.setAttribute("aria-expanded", String(isOpen));
          menuToggle.innerHTML = isOpen ? '<i class="fas fa-xmark"></i>' : '<i class="fas fa-bars"></i>';
        });
        mainNav.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () {
            if (window.innerWidth < 960) {
              mainNav.classList.remove("open");
              menuToggle.setAttribute("aria-expanded", "false");
              menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            }
          });
        });
      }
      function syncBackToTop() {
        if (!backToTopBtn) return;
        backToTopBtn.classList.toggle("show", window.scrollY > 260);
      }
      if (backToTopBtn) {
        window.addEventListener("scroll", syncBackToTop);
        backToTopBtn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
      syncBackToTop();
    })();
  </script>
